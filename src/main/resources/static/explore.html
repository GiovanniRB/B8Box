<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B8Box - Explorar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="wave-field" style="height:380px;">
        <svg viewBox="0 0 1440 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="waveGrad4" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <g fill="none" stroke="url(#waveGrad4)" stroke-width="1.2">
                <path d="M -100 260 C 200 160, 400 320, 700 180 C 1000 40, 1200 160, 1550 0"/>
                <path d="M -100 300 C 220 200, 420 360, 720 220 C 1020 80, 1220 200, 1580 40"/>
            </g>
        </svg>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="/dashboard.html"><i class="bi bi-music-note-beamed"></i> B8Box</a>
            <div class="d-flex align-items-center gap-3">
                <a href="/dashboard.html" class="nav-link-ghost d-none d-md-inline">Início</a>
                <a href="/explore.html" class="nav-link-ghost active d-none d-md-inline">Explorar</a>
                <span class="navbar-text text-white"><i class="bi bi-person-circle"></i> <span id="user-name">Usuário</span></span>
                <button class="btn-pill-outline btn-sm" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5" style="position:relative; z-index:2;">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Explorar</h1>
            <p class="text-muted">Busque qualquer álbum no Spotify e veja os detalhes antes de avaliar.</p>
        </div>

        <div class="row mb-5">
            <div class="col-md-8 mx-auto">
                <div class="input-group">
                    <input type="text" class="form-control form-control-lg" id="search-input" placeholder="Busque um álbum, artista..." aria-label="Buscar álbum">
                    <button class="btn btn-primary" type="button" id="search-btn"><i class="bi bi-search"></i> Buscar</button>
                </div>
            </div>
        </div>

        <div id="results-grid" class="row g-4 mb-5">
            <div class="col-12 text-center text-muted py-5">
                <i class="bi bi-search" style="font-size: 2.5rem; color: var(--purple-2);"></i>
                <p class="mt-2">Busque um álbum para começar a explorar.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/explore.js"></script>
</body>
</html>
