<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Sem capa">
  <!-- Capa reserva para álbuns sem imagem (mesmo gradiente do .album-cover-placeholder) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2a1a52"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="72" fill="#16102b" opacity="0.85"/>
  <circle cx="150" cy="150" r="56" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="150" cy="150" r="42" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="150" cy="150" r="20" fill="#a78bfa"/>
  <circle cx="150" cy="150" r="5" fill="#16102b"/>
</svg>
