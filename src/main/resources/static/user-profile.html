<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B8Box - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="wave-field" style="height:380px;">
        <svg viewBox="0 0 1440 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="waveGrad6" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <g fill="none" stroke="url(#waveGrad6)" stroke-width="1.2">
                <path d="M -100 260 C 200 160, 400 320, 700 180 C 1000 40, 1200 160, 1550 0"/>
                <path d="M -100 300 C 220 200, 420 360, 720 220 C 1020 80, 1220 200, 1580 40"/>
            </g>
        </svg>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="/dashboard.html"><i class="bi bi-music-note-beamed"></i> B8Box</a>
            <div class="d-flex align-items-center gap-3">
                <a href="/dashboard.html" class="nav-link-ghost d-none d-md-inline">Início</a>
                <a href="/explore.html" class="nav-link-ghost d-none d-md-inline">Explorar</a>
                <span class="navbar-text text-white"><i class="bi bi-person-circle"></i> <span id="nav-user-name">Usuário</span></span>
                <button class="btn-pill-outline btn-sm" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5" style="position:relative; z-index:2;">
        <a href="/explore.html" class="back-link mb-3 d-inline-flex"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <!-- PROFILE HEADER -->
    <div class="profile-header">
        <div class="row align-items-center g-4">
            <div class="col-lg-7">
                <div class="d-flex align-items-center gap-4">
                    <div class="profile-avatar-placeholder" id="profile-avatar"><i class="bi bi-person-fill"></i></div>
                    <div>
                        <h2 class="mb-0 fw-bold" id="profile-username">Carregando...</h2>
                        <p class="text-muted mb-2" id="profile-since">&nbsp;</p>
                        <button class="btn btn-primary" id="btn-follow"><i class="bi bi-person-plus"></i> Seguir</button>
                    </div>
                </div>
            </div>
            <div class="col-lg-5 d-flex justify-content-lg-end gap-4 flex-wrap">
                <div class="stat-mini">
                    <span class="num" id="stat-followers">—</span>
                    <span class="label">Seguidores</span>
                </div>
                <div class="stat-mini">
                    <span class="num" id="stat-following">—</span>
                    <span class="label">Seguindo</span>
                </div>
                <div class="stat-mini">
                    <span class="num" id="stat-albums">—</span>
                    <span class="label">Álbuns avaliados</span>
                </div>
                <div class="stat-mini">
                    <span class="num" id="stat-playlists">—</span>
                    <span class="label">Playlists públicas</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid px-5 mt-5 mb-5" style="position:relative; z-index:2;">
        <h5 class="mb-3">Playlists públicas</h5>
        <div class="row g-4" id="playlists-grid">
            <div class="col-12 text-center text-muted py-4">Carregando...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/user-profile.js"></script>
</body>
</html>
