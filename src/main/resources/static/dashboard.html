<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B8Box - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Decorative wavy background -->
    <div class="wave-field" style="height:520px;">
        <svg viewBox="0 0 1440 520" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="waveGrad2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <g fill="none" stroke="url(#waveGrad2)" stroke-width="1.2">
                <path d="M -100 380 C 200 260, 400 460, 700 280 C 1000 100, 1200 240, 1550 60"/>
                <path d="M -100 420 C 220 300, 420 500, 720 320 C 1020 140, 1220 280, 1580 100"/>
                <path d="M -100 460 C 240 340, 440 540, 740 360 C 1040 180, 1240 320, 1610 140"/>
            </g>
        </svg>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="#"><i class="bi bi-music-note-beamed"></i> B8Box</a>
            <div class="d-flex align-items-center gap-3">
                <a href="#" class="nav-link-ghost active d-none d-md-inline">Início</a>
                <a href="#" class="nav-link-ghost d-none d-md-inline">Explorar</a>
                <span class="navbar-text text-white"><i class="bi bi-person-circle"></i> <span id="user-name">Usuário</span></span>
                <button class="btn-pill-outline btn-sm" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </div>
        </div>
    </nav>

    <!-- PROFILE HEADER -->
    <div class="profile-header">
        <div class="row align-items-center g-4">
            <div class="col-lg-7">
                <div class="d-flex align-items-center gap-4">
                    <div class="profile-avatar-placeholder"><i class="bi bi-person-fill"></i></div>
                    <div>
                        <h2 class="mb-0 fw-bold" id="user-card-name">Usuário</h2>
                        <p class="text-muted mb-0">Membro da comunidade B8Box</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-5 d-flex justify-content-lg-end gap-3 flex-wrap">
                <div class="stat-mini">
                    <span class="num" id="stat-albuns">—</span>
                    <span class="label">Álbuns avaliados</span>
                </div>
                <div class="stat-mini">
                    <span class="num" id="stat-playlists">—</span>
                    <span class="label">Playlists</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-4 px-5" style="position:relative; z-index:2;">

        <!-- Barra de Busca (Spotify) -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="input-group">
                    <input type="text" class="form-control form-control-lg" id="search-input" placeholder="Busque um álbum no Spotify..." aria-label="Buscar álbum">
                    <button class="btn btn-primary" type="button" id="search-btn"><i class="bi bi-search"></i> Buscar</button>
                </div>
                <div id="search-results" class="list-group mt-2 d-none"></div>
            </div>
        </div>

        <!-- Grid Principal -->
        <div class="row">
            <!-- Coluna Lateral -->
            <div class="col-lg-3 d-none d-lg-block">
                <div class="card p-3 mb-4">
                    <h6 class="mb-3">Gêneros favoritos</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="tag-pill"><span class="tag-dot"></span> Indie Pop</span>
                        <span class="tag-pill"><span class="tag-dot"></span> Alt-Pop</span>
                    </div>
                </div>

                <div class="card p-4">
                    <h5 class="mb-3">Suas Estatísticas</h5>
                    <div class="d-flex flex-column gap-2">
                        <span><i class="bi bi-collection-fill text-primary"></i> <span id="stat-albuns-side">—</span> Álbuns</span>
                        <span><i class="bi bi-list-ul" style="color:var(--gold)"></i> <span id="stat-playlists-side">—</span> Playlists</span>
                        <span><i class="bi bi-star-fill" style="color:var(--gold)"></i> <span id="stat-ratings-side">—</span> Avaliações</span>
                    </div>
                </div>
            </div>

            <!-- Coluna Principal (Tabs e Feed) -->
            <div class="col-lg-9">
                <ul class="nav nav-tabs" id="main-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="tab-meus-albuns" data-bs-toggle="tab" data-bs-target="#content-area" type="button" role="tab" onclick="loadMyAlbums()"><i class="bi bi-collection"></i> Meus Álbuns</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tab-playlists" data-bs-toggle="tab" data-bs-target="#content-area" type="button" role="tab" onclick="loadMyPlaylists()"><i class="bi bi-list-ul"></i> Minhas Playlists</button>
                    </li>
                </ul>

                <!-- dashboard.js deve renderizar cada álbum como:
                     <a href="album-detail.html?id=ID_DO_ALBUM" class="album-card ..."> ... </a>
                     assim o clique no card leva direto para a tela de detalhes -->
                <div id="content-area" class="tab-content mt-4">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-music-note-beamed" style="font-size: 2.5rem; color: var(--purple-2);"></i>
                        <p class="mt-2">Carregando seus álbuns...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Avaliar Álbum -->
    <div class="modal fade" id="ratingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="border-bottom:1px solid var(--border-soft);">
                    <h5 class="modal-title">Avaliar Álbum</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="rating-album-id">
                    <div class="mb-3">
                        <label for="rating-score" class="form-label">Nota (0 a 10)</label>
                        <input type="number" class="form-control" id="rating-score" min="0" max="10" step="0.1" placeholder="9.5">
                    </div>
                    <div class="mb-3">
                        <label for="rating-review" class="form-label">Resenha</label>
                        <textarea class="form-control" id="rating-review" rows="3" placeholder="O que você achou deste álbum?"></textarea>
                    </div>
                </div>
                <div class="modal-footer" style="border-top:1px solid var(--border-soft);">
                    <button type="button" class="btn-pill-outline" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="save-rating-btn">Salvar Avaliação</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
