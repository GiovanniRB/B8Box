<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B8Box - Comunidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg" data-b8-navbar="communities"></nav>

    <main class="forum-page">
        <a href="/communities.html" class="back-link mb-3 d-inline-flex"><i class="bi bi-arrow-left" aria-hidden="true"></i> Comunidades</a>

        <div class="card forum-card mb-4 d-none" id="community-header">
            <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                <div class="forum-title-block">
                    <h2 class="fw-bold mb-2" id="community-name"></h2>
                    <p class="community-description mb-2 d-none" id="community-description"></p>
                    <div class="community-meta" id="community-meta"></div>
                </div>
                <div class="d-flex gap-2 flex-wrap" id="community-actions"></div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3 d-none" id="threads-head">
            <h5 class="mb-0">Discussões</h5>
            <button type="button" class="btn btn-primary d-none" id="btn-new-thread"><i class="bi bi-plus-lg" aria-hidden="true"></i> Nova discussão</button>
        </div>

        <div class="d-flex flex-column gap-3" id="thread-list">
            <div class="text-center text-muted py-4">Carregando...</div>
        </div>
    </main>

    <!-- NOVA DISCUSSÃO -->
    <div class="modal fade" id="threadModal" tabindex="-1" aria-labelledby="threadModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <form class="modal-content" id="thread-form">
                <div class="modal-header">
                    <h5 class="modal-title" id="threadModalLabel">Nova discussão</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="thread-title">Título</label>
                        <input type="text" class="form-control" id="thread-title" minlength="3" maxlength="120" required>
                    </div>
                    <div class="mb-1">
                        <label class="form-label" for="thread-content">Texto</label>
                        <textarea class="form-control" id="thread-content" rows="6" maxlength="5000" required></textarea>
                        <div class="text-end small text-muted mt-1" id="thread-chars">0/5000</div>
                    </div>
                    <p class="text-danger small mt-2 mb-0 d-none" id="thread-error" role="alert"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/community.js"></script>
</body>
</html>
