<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B8Box - Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="wave-field" style="height:380px;">
        <svg viewBox="0 0 1440 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="waveGrad5" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <g fill="none" stroke="url(#waveGrad5)" stroke-width="1.2">
                <path d="M -100 260 C 200 160, 400 320, 700 180 C 1000 40, 1200 160, 1550 0"/>
                <path d="M -100 300 C 220 200, 420 360, 720 220 C 1020 80, 1220 200, 1580 40"/>
            </g>
        </svg>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="/dashboard.html"><i class="bi bi-music-note-beamed"></i> B8Box</a>
            <div class="d-flex align-items-center gap-3">
                <a href="/dashboard.html" class="nav-link-ghost d-none d-md-inline">Início</a>
                <a href="/explore.html" class="nav-link-ghost d-none d-md-inline">Explorar</a>
                <span class="navbar-text text-white"><i class="bi bi-person-circle"></i> <span id="user-name">Usuário</span></span>
                <button class="btn-pill-outline btn-sm" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5" style="position:relative; z-index:2;">
        <a href="/dashboard.html" class="back-link mb-3 d-inline-flex"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <!-- PLAYLIST HEADER -->
    <div class="album-hero">
        <div class="d-flex flex-wrap align-items-center gap-4 w-100">
            <div class="album-hero-cover" style="background: linear-gradient(135deg, var(--purple-1), #2a1a52);">
                <i class="bi bi-list-ul"></i>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <h1 class="fw-bold mb-0" id="playlist-title">Carregando...</h1>
                    <span class="tag-pill" id="playlist-visibility-badge">—</span>
                </div>
                <p class="text-muted mb-2" id="playlist-description">&nbsp;</p>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn-pill-outline btn-sm" id="btn-edit-playlist"><i class="bi bi-pencil"></i> Editar</button>
                    <button class="btn btn-outline-danger btn-sm" id="btn-delete-playlist"><i class="bi bi-trash"></i> Apagar playlist</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FORM DE EDIÇÃO (escondido por padrão) -->
    <div class="container-fluid px-5 mt-4" style="position:relative; z-index:2;">
        <div id="edit-form" class="card p-4 mb-4 d-none">
            <div class="mb-3">
                <label class="form-label">Título</label>
                <input type="text" class="form-control" id="edit-title">
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" id="edit-description" rows="2"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="edit-public">
                <label class="form-check-label" for="edit-public">Playlist pública</label>
            </div>
            <div>
                <button class="btn btn-primary" id="btn-save-playlist">Salvar</button>
                <button class="btn-pill-outline" id="btn-cancel-edit">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="container-fluid px-5 mt-2 mb-5" style="position:relative; z-index:2;">
        <h5 class="mb-3">Álbuns</h5>
        <div class="row g-3" id="track-list">
            <div class="text-center text-muted py-4">Carregando faixas...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/playlist.js"></script>
</body>
</html>
