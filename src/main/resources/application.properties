# ============================================================
# CONFIGURAÇÃO PÚBLICA (vai pro git) — NENHUM SEGREDO AQUI.
#
# Os valores sensíveis vêm de:
#   - desenvolvimento: arquivo src/main/resources/application-local.properties
#     (NÃO vai pro git — está no .gitignore; use o .example como modelo)
#   - produção (Render/Railway etc.): variáveis de ambiente com os mesmos nomes
# Se alguma variável obrigatória faltar, a aplicação não sobe e avisa qual.
# ============================================================
spring.config.import=optional:classpath:application-local.properties

# ============================================================
# BANCO DE DADOS (Aiven PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/HIBERNATE
# ============================================================
# Em produção, depois que o banco estiver estável, use DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
# Carrega relacionamentos em lote: ao percorrer 20 avaliações, o Hibernate
# busca os 20 álbuns (ou usuários) numa consulta só ("where id in (...)"),
# em vez de uma consulta por item. Com o banco longe (~0,2 s por consulta)
# isso faz muita diferença no tempo das telas.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ============================================================
# SERVIDOR
# ============================================================
server.port=${PORT:8080}
server.compression.enabled=true
# nunca mostrar stack trace / detalhes internos nas páginas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Origens extras liberadas no CORS (separadas por vírgula). Vazio = só a
# própria origem, que é o caso normal (front servido pelo Spring Boot).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ============================================================
# UPLOAD (foto de perfil)
# ============================================================
# O AvatarService aceita no máximo 2 MB; o limite do Spring fica um pouco
# acima para a mensagem amigável do serviço aparecer na maioria dos casos.
# resolve-lazily: o arquivo só é lido dentro do controller, então o erro de
# "arquivo grande demais" também cai no tratamento do UserController.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================================================
# SPOTIFY
# ============================================================
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
spotify.redirect.uri=${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}

spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**