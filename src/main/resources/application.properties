# ============================================================
# BANCO DE DADOS (AIVEN PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://b8box-b8box.g.aivencloud.com:00000/defaultdb?sslmode=require
spring.datasource.username=meuuser
spring.datasource.password=minhasenha
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080

# ============================================================
# JWT
# ============================================================
jwt.secret=B8BoxSecretKey2024!SuperSeguraParaAssinarTokensJWT
jwt.expiration=86400000

# ============================================================
# SPOTIFY
# ============================================================
spotify.client.id=id
spotify.client.secret=secret
spotify.redirect.uri=http://localhost:8080/api/spotify/callback

# Otimizações de performance
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true